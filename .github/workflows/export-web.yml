name: export-web.yml

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libfontconfig1-dev libcairo2-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libwebp-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'

      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"default"'

      - name: Install additional packages
        run: renv::install(c("pak", "writexl"))
        shell: Rscript {0}

      - name: Install shinylive
        run: pak::pak("posit-dev/r-shinylive@0179e311f47144b1570e3de9c401815a20add84e")
        shell: Rscript {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export to wasm
        run: |
          Rscript devel/export-shinylive.R

      - name: Zip dist
        run: zip -r anthro-${{ github.ref_name }}-dist.zip dist

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: anthro-${{ github.ref_name }}-dist.zip
